name: Update

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: |-
    ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

on:
  pull_request:
    branches:
      - main
      - epic/*
    paths:
      - .pre-commit-config.yaml
  workflow_dispatch:

jobs:
  lock:
    uses: ComPWA/actions/.github/workflows/lock.yml@24413cd08a4657e18a344713ff7e91360dff9b0d # v4.1.0
    secrets:
      token: ${{ secrets.PAT }}
