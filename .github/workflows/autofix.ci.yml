name: autofix.ci

on:
  pull_request:
    types:
      - labeled
      - opened
      - reopened
      - synchronize
    branches:
      - main
      - epic/*
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  autofix:
    uses: ComPWA/actions/.github/workflows/autofix.ci.yml@588d066e5319c158d8ebc23b9699f19b7c68c641 # v4.2.2
