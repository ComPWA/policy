name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: |-
    ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

on:
  push:
    branches:
      - main
      - epic/*
      - "[0-9]+.[0-9]+.x"
  pull_request:
    branches:
      - main
      - epic/*
      - "[0-9]+.[0-9]+.x"
  workflow_dispatch:

jobs:
  doc:
    uses: ComPWA/actions/.github/workflows/ci-docs.yml@b24e7f576962d043cf710692c57b1e78f2e15b61
    permissions:
      pages: write
      id-token: write
    with:
      gh-pages: true
  linkcheck:
    uses: ComPWA/actions/.github/workflows/ci-linkcheck.yml@b24e7f576962d043cf710692c57b1e78f2e15b61
  style:
    secrets:
      token: ${{ secrets.PAT }}
    uses: ComPWA/actions/.github/workflows/style.yml@826112415aa683bb2d73df87e84444a047f8cad7 # v4.1.8
  test:
    uses: ComPWA/actions/.github/workflows/test.yml@826112415aa683bb2d73df87e84444a047f8cad7 # v4.1.8
    with:
      coverage-python-version: "3.14"
      macos-python-version: "3.11"
      multithreaded: false
