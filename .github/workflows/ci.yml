name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: |-
    ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

on:
  push:
    branches:
      - main
      - epic/*
      - "[0-9]+.[0-9]+.x"
  pull_request:
    branches:
      - main
      - epic/*
      - "[0-9]+.[0-9]+.x"
  workflow_dispatch:

jobs:
  doc:
    uses: ComPWA/actions/.github/workflows/ci-docs.yml@847c8b2dea7471eea5ebe9918f71d7441aa58ca0
    permissions:
      pages: write
      id-token: write
    with:
      gh-pages: true
  linkcheck:
    uses: ComPWA/actions/.github/workflows/ci-linkcheck.yml@847c8b2dea7471eea5ebe9918f71d7441aa58ca0
  style:
    secrets:
      token: ${{ secrets.PAT }}
    uses: ComPWA/actions/.github/workflows/style.yml@847c8b2dea7471eea5ebe9918f71d7441aa58ca0
    with:
      hooks: "check-dev-files self-check tombi-format tombi-lint ty"
  test:
    uses: ComPWA/actions/.github/workflows/test.yml@847c8b2dea7471eea5ebe9918f71d7441aa58ca0
    with:
      matrix: |
        {
          "python-version": [
            "3.11",
            "3.12",
            "3.13",
            "3.15"
          ],
          "runs-on": [
            "ubuntu-24.04"
          ],
          "include": [
            {
              "codecov": "codecov",
              "python-version": "3.14",
              "runs-on": "ubuntu-24.04"
            },
            {
              "python-version": "3.11",
              "runs-on": "macos-15"
            }
          ]
        }
      multithreaded: false
      ubuntu-runner: ubuntu-26.04
