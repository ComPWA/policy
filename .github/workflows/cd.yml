name: CD

on:
  release:
    types:
      - prereleased
      - released

jobs:
  milestone:
    if: startsWith(github.ref, 'refs/tags')
    uses: ComPWA/actions/.github/workflows/close-milestone.yml@99e91bcc486218c7dbbb4f2e0319bfcb028562aa # 4.0.1
  push:
    if: startsWith(github.ref, 'refs/tags') && !github.event.release.prerelease
    secrets: inherit
    uses: ComPWA/actions/.github/workflows/push-to-version-branches.yml@99e91bcc486218c7dbbb4f2e0319bfcb028562aa # 4.0.1
