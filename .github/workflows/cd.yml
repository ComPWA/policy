name: CD

on:
  release:
    types:
      - prereleased
      - released

jobs:
  milestone:
    if: startsWith(github.ref, 'refs/tags')
    uses: ComPWA/actions/.github/workflows/close-milestone.yml@9ccbc279d7813fb8ceca8d3b1cda27e584695ab9 # PR 183
  push:
    if: startsWith(github.ref, 'refs/tags') && !github.event.release.prerelease
    secrets: inherit
    uses: ComPWA/actions/.github/workflows/push-to-version-branches.yml@9ccbc279d7813fb8ceca8d3b1cda27e584695ab9 # PR 183
