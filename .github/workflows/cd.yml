name: CD

on:
  release:
    types:
      - prereleased
      - released

jobs:
  milestone:
    if: startsWith(github.ref, 'refs/tags')
    uses: ComPWA/actions/.github/workflows/close-milestone.yml@e72eb52f3e2af05d94b83d4f66330ce89f87314c # PR 182
  push:
    if: startsWith(github.ref, 'refs/tags') && !github.event.release.prerelease
    secrets: inherit
    uses: ComPWA/actions/.github/workflows/push-to-version-branches.yml@e72eb52f3e2af05d94b83d4f66330ce89f87314c # PR 182
