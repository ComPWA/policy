name: Update runner labels

on:
  schedule:
    - cron: "23 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-runner-labels
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install dependencies
        run: |
          uv sync --locked
          uv tool install prek
      - name: Refresh runner labels
        run: uvx --from poethepoet poe update-runner-labels
      - name: Check and format generated files
        run: |
          if ! prek run --files src/compwa_policy/config.py compwa-policy.schema.json; then
            prek run --files src/compwa_policy/config.py compwa-policy.schema.json
          fi
      - name: Create or update maintenance pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.PAT }}
          branch: maintenance/update-runner-labels
          delete-branch: true
          add-paths: |
            src/compwa_policy/config.py
            compwa-policy.schema.json
          commit-message: "MAINT: update GitHub runner labels"
          title: "MAINT: update GitHub runner labels"
          body: Refresh the supported runner labels from the public GitHub runner image table and regenerate the policy configuration schema.
