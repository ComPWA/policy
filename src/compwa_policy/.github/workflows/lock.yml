name: Update

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: |-
    ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

on:
  pull_request:
    branches:
      - main
      - epic/*
    paths:
      - .constraints/py3.*.txt
      - .pre-commit-config.yaml
      - Manifest.toml
      - pixi.lock
      - uv.lock
  schedule:
    - cron: "0 3 7 */2 *"
  workflow_dispatch:

jobs:
  lock:
    uses: ComPWA/actions/.github/workflows/lock.yml@483174d7f7f9c0ddbe59643584fdac25004cf887 # v4.1.7
    secrets:
      token: ${{ secrets.PAT }}
