name: CD

on:
  release:
    types:
      - prereleased
      - released

jobs:
  milestone:
    if: startsWith(github.ref, 'refs/tags')
    uses: ComPWA/actions/.github/workflows/close-milestone.yml@483174d7f7f9c0ddbe59643584fdac25004cf887 # v4.1.7
  package-name:
    uses: ComPWA/actions/.github/workflows/get-pypi-name.yml@483174d7f7f9c0ddbe59643584fdac25004cf887 # v4.1.7
  pypi:
    environment:
      name: PyPI
      url: https://pypi.org/p/${{ needs.package-name.outputs.name }}
    if: startsWith(github.ref, 'refs/tags')
    name: Publish to PyPI
    needs:
      - package-name
    permissions:
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - uses: ComPWA/actions/build-pypi-distribution@483174d7f7f9c0ddbe59643584fdac25004cf887 # v4.1.7
      - uses: pypa/gh-action-pypi-publish@release/v1
  push:
    if: startsWith(github.ref, 'refs/tags') && !github.event.release.prerelease
    permissions:
      contents: write
    uses: ComPWA/actions/.github/workflows/push-to-version-branches.yml@483174d7f7f9c0ddbe59643584fdac25004cf887 # v4.1.7
